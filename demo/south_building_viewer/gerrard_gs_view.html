<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerrard Hall · 3DGS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0f14;
      --panel: #161b22;
      --line: #2a3340;
      --text: #e7edf5;
      --muted: #8b98a8;
      --accent: #7eb6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", "PingFang SC", sans-serif; }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; left: 16px; top: 16px; z-index: 2; max-width: 520px; pointer-events: none; }
    #hud a, #hud button { pointer-events: auto; }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    .sub { color: var(--muted); margin-top: 4px; font-size: 12px; }
    .links { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    a { color: var(--accent); }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.55; cursor: default; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    #error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; z-index: 3; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="error"></div>
  <div id="hud">
    <h1>Gerrard Hall · 3DGS</h1>
    <div class="sub" id="status">加载高斯模型…</div>
    <div class="links">
      <a href="./?scene=gerrard">稠密网格</a>
      <a href="gerrard_gs.html">对照图</a>
      <button id="reset" type="button">重置视角</button>
      <button id="raw" type="button" aria-pressed="false" disabled>原始模型</button>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
        "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { TrackballControls } from "three/addons/controls/TrackballControls.js";
    import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";

    const view = document.getElementById("view");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x0c0f14, 1);
    view.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 3000);
    const controls = new TrackballControls(camera, renderer.domElement);
    controls.rotateSpeed = 2.4;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.8;
    controls.staticMoving = false;
    controls.dynamicDampingFactor = 0.15;

    const center = new THREE.Vector3(0.0308, -0.5452, 0.0249);
    const radius = 30.18;

    function fit() {
      camera.near = radius / 1000;
      camera.far = radius * 100;
      camera.position.copy(center).add(new THREE.Vector3(radius, radius * 0.55, radius));
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
      controls._position0.copy(camera.position);
      controls._target0.copy(controls.target);
      controls._up0.copy(camera.up);
      controls._zoom0 = camera.zoom;
    }

    function resize() {
      const width = view.clientWidth;
      const height = view.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
    }

    resize();
    fit();
    window.addEventListener("resize", resize);
    document.getElementById("reset").addEventListener("click", () => {
      controls.reset();
    });

    const viewer = new GaussianSplats3D.Viewer({
      selfDrivenMode: false,
      renderer,
      camera,
      threeScene: scene,
      rootElement: view,
      useBuiltInControls: false,
      sharedMemoryForWorkers: false,
      gpuAcceleratedSort: false,
      enableSIMDInSort: false,
      integerBasedSort: false,
      sphericalHarmonicsDegree: 2,
      antialiased: true,
      enableOptionalEffects: true,
      sceneRevealMode: GaussianSplats3D.SceneRevealMode.Instant,
      renderMode: GaussianSplats3D.RenderMode.Always,
    });

    function frame() {
      requestAnimationFrame(frame);
      controls.update();
      viewer.update();
      if (viewer.shouldRender()) viewer.render();
    }
    frame();

    const rawButton = document.getElementById("raw");
    let showingRaw = false;
    let rawPromise = null;

    function sceneCount(index) {
      return viewer.splatMesh.getScene(index).splatBuffer.getSplatCount();
    }

    function showClean() {
      viewer.splatMesh.getScene(0).visible = true;
      if (viewer.splatMesh.getSceneCount() > 1) viewer.splatMesh.getScene(1).visible = false;
      showingRaw = false;
      rawButton.textContent = "原始模型";
      rawButton.setAttribute("aria-pressed", "false");
      const count = sceneCount(0);
      statusEl.textContent = `${count.toLocaleString("zh-CN")} 个高斯 · 房子周围约 4.5 米以内 · 左键旋转，右键平移，滚轮缩放`;
    }

    function showRaw() {
      if (!rawPromise) {
        statusEl.textContent = "加载原始模型…";
        rawButton.disabled = true;
        rawPromise = viewer.addSplatScene("gerrard_gs/point_cloud.ply", {
          splatAlphaRemovalThreshold: 1,
          showLoadingUI: true,
        }).then(() => {
          rawButton.disabled = false;
        }).catch((err) => {
          rawPromise = null;
          rawButton.disabled = false;
          errorEl.style.display = "grid";
          errorEl.textContent = err && err.message ? err.message : String(err);
          statusEl.textContent = "原始模型没有加载出来";
          throw err;
        });
      }
      rawPromise.then(() => {
        viewer.splatMesh.getScene(0).visible = false;
        viewer.splatMesh.getScene(1).visible = true;
        showingRaw = true;
        rawButton.textContent = "清理后";
        rawButton.setAttribute("aria-pressed", "true");
        const count = sceneCount(1);
        statusEl.textContent = `${count.toLocaleString("zh-CN")} 个高斯 · 原始模型，未删减 · 左键旋转，右键平移，滚轮缩放`;
      });
    }

    rawButton.addEventListener("click", () => {
      if (showingRaw) showClean();
      else showRaw();
    });

    viewer.addSplatScene("gerrard_gs/point_cloud_view_near.ply", {
      splatAlphaRemovalThreshold: 1,
      showLoadingUI: true,
    }).then(() => {
      rawButton.disabled = false;
      showClean();
    }).catch((err) => {
      errorEl.style.display = "grid";
      errorEl.textContent = err && err.message ? err.message : String(err);
      statusEl.textContent = "高斯模型没有加载出来";
    });
  </script>
</body>
</html>
