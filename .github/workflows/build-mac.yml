name: COLMAP (Mac)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

jobs:
  build:
    name: ${{ matrix.config.os }} ${{ matrix.config.arch }} ${{ matrix.config.cmakeBuildType }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config: [
          {
            os: macos-15,
            arch: arm64,
            cmakeBuildType: Release,
          },
        ]

    env:
      COMPILER_CACHE_VERSION: 2
      COMPILER_CACHE_DIR: ${{ github.workspace }}/compiler-cache
      CCACHE_DIR: ${{ github.workspace }}/compiler-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      FETCHCONTENT_CACHE_VERSION: 1
      FETCHCONTENT_CACHE_DIR: ${{ github.workspace }}/build/_deps
      GLOG_v: 2
      GLOG_logtostderr: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set compiler cache epoch
        id: compiler-cache-epoch
        shell: bash
        # GitHub cache entries are immutable. Rotate weekly so changed objects
        # are incorporated without creating a new archive for every run.
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        id: cache-compiler
        with:
          key: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.cmakeBuildType }}-${{ steps.compiler-cache-epoch.outputs.value }}
          restore-keys: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.cmakeBuildType }}-
          path: ${{ env.COMPILER_CACHE_DIR }}

      - name: Restore FetchContent cache
        uses: actions/cache/restore@v6
        id: cache-fetchcontent
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          restore-keys: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}

      - name: Setup Mac
        run: |
          brew install \
            cmake \
            ninja \
            boost \
            eigen \
            openimageio \
            curl \
            metis \
            glog \
            googletest \
            ceres-solver \
            qt \
            glew \
            cgal \
            sqlite3 \
            ccache \
            libomp
          brew link --force libomp
          ccache --zero-stats

      - name: Configure and build
        run: |
          export PATH="/usr/local/opt/qt/bin:$PATH"
          cmake --version
          mkdir -p build
          cd build
          cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.cmakeBuildType }} \
            -DTESTS_ENABLED=ON \
            -DWERROR_ENABLED=ON \
            -DQt6_DIR="$(brew --prefix qt)/lib/cmake/Qt6" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
          ninja

      - name: Run tests
        run: |
          cd build
          set +e
          ctest --output-on-failure

      - name: Export package
        run: |
          ./scripts/shell/build_mac_app.sh build/src/colmap/exe/colmap

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: colmap-arm64-macos
          path: build/src/colmap/exe/COLMAP-mac.zip

      - name: Cleanup compiler cache
        run: |
          set -x
          ccache --cleanup
          ccache --show-stats --verbose

      - name: Save compiler cache
        # Pull-request caches are scoped to the PR merge ref, cannot seed main,
        # and still consume the repository-wide cache quota.
        if: ${{ success() && github.event_name != 'pull_request' && steps.cache-compiler.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ matrix.config.cmakeBuildType }}-${{ steps.compiler-cache-epoch.outputs.value }}
          path: ${{ env.COMPILER_CACHE_DIR }}

      - name: Save FetchContent cache
        # Avoid duplicate dependency archives that only this PR can restore.
        if: ${{ success() && github.event_name != 'pull_request' && steps.cache-fetchcontent.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}
