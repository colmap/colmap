name: COLMAP (Docker)

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened ]
  release:
    types: [ published, edited ]

env:
  IS_RELEASE: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags') }}
  FETCHCONTENT_CACHE_VERSION: 1
  FETCHCONTENT_CACHE_DIR: build/_deps
  COMPILER_CACHE_VERSION: 2
  CCACHE_DIR: build/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7

      - name: Set compiler cache epoch
        id: compiler-cache-epoch
        shell: bash
        # GitHub cache entries are immutable. Rotate weekly so changed objects
        # are incorporated without creating a new archive for every run.
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore FetchContent cache
        uses: actions/cache/restore@v6
        id: cache-fetchcontent
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-docker-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          restore-keys: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-docker-
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        id: cache-ccache
        with:
          key: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-docker-${{ steps.compiler-cache-epoch.outputs.value }}
          restore-keys: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-docker-
          path: ${{ env.CCACHE_DIR }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          dockertag=$(date +%Y%m%d).${{ github.run_number }}
          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            cuda_archs="50;60;70;75;90"
          else
            cuda_archs="50"
          fi
          mkdir -p build/.ccache build/_deps
          docker_args=(
            --file docker/Dockerfile
            --build-arg CUDA_ARCHITECTURES="$cuda_archs"
            --build-arg CCACHE_MAXSIZE="${CCACHE_MAXSIZE}"
            --build-arg FETCHCONTENT_FULLY_DISCONNECTED=${{ steps.cache-fetchcontent.outputs.cache-hit == 'true' && 'ON' || 'OFF' }}
          )
          docker build . \
            "${docker_args[@]}" \
            --tag colmap/colmap:$dockertag
          # Extract updated build caches from the builder stage.
          docker build . \
            "${docker_args[@]}" \
            --target cache-export \
            --output type=local,dest=build/cache-export
          rm -rf build/.ccache build/_deps
          mv build/cache-export/.ccache build/.ccache
          mv build/cache-export/_deps build/_deps
          rm -rf build/cache-export
          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            docker tag colmap/colmap:$dockertag colmap/colmap:latest
            docker push colmap/colmap:$dockertag
            docker push colmap/colmap:latest
          fi

      - name: Cleanup compiler cache
        run: |
          set -x
          sudo apt-get install -y ccache
          ccache --cleanup
          ccache --show-stats --verbose

      - name: Save compiler cache
        # Pull-request caches are scoped to the PR merge ref, cannot seed main,
        # and still consume the repository-wide cache quota.
        if: ${{ success() && github.event_name != 'pull_request' && steps.cache-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: colmap-compiler-v${{ env.COMPILER_CACHE_VERSION }}-docker-${{ steps.compiler-cache-epoch.outputs.value }}
          path: ${{ env.CCACHE_DIR }}

      - name: Save FetchContent cache
        # Avoid duplicate dependency archives that only this PR can restore.
        if: ${{ success() && github.event_name != 'pull_request' && steps.cache-fetchcontent.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          key: fetchcontent-v${{ env.FETCHCONTENT_CACHE_VERSION }}-docker-${{ hashFiles('cmake/FindDependencies.cmake', 'src/thirdparty/CMakeLists.txt') }}
          path: ${{ env.FETCHCONTENT_CACHE_DIR }}
